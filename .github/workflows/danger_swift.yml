name: Danger Swift

on:
  pull_request:
  workflow_dispatch:

jobs:
  # Danger
  # https://github.com/danger/swift
  danger:
    runs-on: ubuntu-latest
    name: "Run Danger"
    steps:
      - uses: actions/checkout@v4
      - name: Danger
        uses: danger/swift@3.21.1
        with:
            args: --failOnErrors --no-publish-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
