  SwiftLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Download SwiftLint
        run: |
          curl -L -o swiftlint.tar.gz https://github.com/realm/SwiftLint/releases/download/0.53.0/portable_swiftlint_linux.tar.gz
          tar -xzf swiftlint.tar.gz
          chmod +x swiftlint
          sudo mv swiftlint /usr/local/bin/

      - name: Run SwiftLint
        run: swiftlint --strict

